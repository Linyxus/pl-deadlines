<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <div class="page">
      <div class="wrap">
        {% include header.html %}
        {{ content }}
        <footer class="foot tx">
          {% include footer.html %}
        </footer>
      </div>
    </div>
    {% include data.html %}
    <script src="{{ '/static/js/site.js' | prepend: site.baseurl }}?t={{ site.time | date: '%s' }}"></script>
    {% if site.ga_id %}<script>{% include google_analytics.js %}</script>{% endif %}
  </body>
</html>
